# Releases the SDK and publishes it to PyPI every time `main` moves.
#
# The bump comes from Conventional Commits since the last v* tag:
#   feat!: / fix!: / "BREAKING CHANGE:"  -> major
#   feat:                                -> minor
#   fix: / perf:                         -> patch
#   anything else (docs, ci, chore...)   -> no release
#
# The release job writes the new version into the repo (pyproject, __version__,
# user agent, and the generate.sh default so a regen keeps it), commits
# `chore(release): vX.Y.Z`, tags it and creates a GitHub Release. The publish
# job then builds that tag and uploads it. If publishing fails, re-run just the
# failed job; the tag and release are already in place.
#
# PyPI auth is Trusted Publishing, so there is no token. One-time setup on
# pypi.org: cleanlist-ai -> Manage -> Publishing -> add a GitHub publisher with
# owner Cleanlist-ai, repo cleanlist-python-client, workflow release.yml.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Skip the bump commit this workflow pushes.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          msgs=$(git log "${last_tag:+$last_tag..}HEAD" --pretty=%B)
          if grep -qE '(^|\s)BREAKING CHANGE:|^[a-z]+(\([^)]+\))?!:' <<<"$msgs"; then bump="major"
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$msgs"; then bump="minor"
          elif grep -qE '^(fix|perf)(\([^)]+\))?:' <<<"$msgs"; then bump="patch"
          else
            echo "No feat/fix/perf commits since ${last_tag:-the first commit}; nothing to release."
            exit 0
          fi
          old=$(grep -m1 -oP '^version = "\K[^"]+' pyproject.toml)
          IFS=. read -r major minor patch <<<"$old"
          case $bump in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
          esac
          echo "$bump: $old -> $new"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Bump version, tag, push
        if: steps.next.outputs.version
        env:
          OLD: ${{ steps.next.outputs.old }}
          NEW: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          o=${OLD//./\\.}
          # Only package-version strings. "The version of the OpenAPI document"
          # headers are the API version and stay as they are.
          git grep -lF "$OLD" -- pyproject.toml scripts/generate.sh cleanlist_ai | xargs -r sed -i -E \
            -e "s/^version = \"$o\"/version = \"$NEW\"/" \
            -e "s/__version__ = \"$o\"/__version__ = \"$NEW\"/" \
            -e "s/SDK Package Version: $o/SDK Package Version: $NEW/" \
            -e "s#OpenAPI-Generator/$o/#OpenAPI-Generator/$NEW/#" \
            -e "s/PKG_VERSION:-$o\}/PKG_VERSION:-$NEW}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$NEW"
          git tag -a "v$NEW" -m "v$NEW"
          git push origin HEAD:main "v$NEW"

      - name: Create GitHub Release
        if: steps.next.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.next.outputs.version }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

  publish:
    needs: release
    if: needs.release.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          pipx run build
          ls dist/cleanlist_ai-"$VERSION"-py3-none-any.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
